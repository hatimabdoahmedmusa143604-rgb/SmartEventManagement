<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - SmartEvent</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .feedback-page {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
        }

        .feedback-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .feedback-header p {
            color: #2563eb;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .feedback-header h1 {
            font-size: 42px;
            margin: 0 0 15px;
            color: #172033;
        }

        .feedback-header span {
            color: #64748b;
            font-size: 18px;
        }

        #feedbackForm {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group > label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #172033;
            font-size: 17px;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 130px;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .rating-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rating-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            width: fit-content;
        }

        .rating-options label:hover {
            background: #f8fafc;
        }

        .rating-options input[type="radio"] {
            margin: 0;
        }

        .feedback-btn {
            display: block;
            width: 100%;
            border: none;
            cursor: pointer;
            padding: 15px;
            font-size: 17px;
            border-radius: 10px;
        }

        .feedback-message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #16a34a;
        }

        @media (max-width: 600px) {
            .feedback-page {
                margin: 30px 15px;
                padding: 15px;
            }

            #feedbackForm {
                padding: 25px 20px;
            }

            .feedback-header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        SmartEvent
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<main>

    <section class="feedback-page">

        <div class="feedback-header">
            <p>YOUR FEEDBACK</p>

            <h1>How Was Your Experience?</h1>

            <span>
                Help us improve future university events.
            </span>
        </div>

        <form id="feedbackForm">

            <div class="form-group">
                <label for="feedbackName">Your Name</label>

                <input
                    type="text"
                    id="feedbackName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="eventName">Event</label>

                <select id="eventName" required>
                    <option value="">Select Event</option>
                    <option value="AI Workshop">AI Workshop</option>
                    <option value="Coding Competition">Coding Competition</option>
                    <option value="Sports Day">Sports Day</option>
                </select>
            </div>

            <div class="form-group">

                <label>Rating</label>

                <div class="rating-options">

                    <label>
                        <input type="radio" name="rating" value="5" required>
                        ⭐⭐⭐⭐⭐
                    </label>

                    <label>
                        <input type="radio" name="rating" value="4">
                        ⭐⭐⭐⭐
                    </label>

                    <label>
                        <input type="radio" name="rating" value="3">
                        ⭐⭐⭐
                    </label>

                    <label>
                        <input type="radio" name="rating" value="2">
                        ⭐⭐
                    </label>

                    <label>
                        <input type="radio" name="rating" value="1">
                        ⭐
                    </label>

                </div>

            </div>

            <div class="form-group">

                <label for="comments">Comments</label>

                <textarea
                    id="comments"
                    rows="5"
                    placeholder="Write your feedback..."
                    required
                ></textarea>

            </div>

            <button
                type="submit"
                class="btn primary feedback-btn">
                Submit Feedback
            </button>

        </form>

        <div id="feedbackMessage" class="feedback-message"></div>

    </section>

</main>

<footer>
    <p>© 2026 Smart Event Management System</p>
    <p>Designed for University Students</p>
</footer>

<script src="script.js"></script>

</body>
</html>
